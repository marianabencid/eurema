<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EUREMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;800&family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --tq:#F2762E; --tp:#B5501A; --tql2:#F7A374; --brand:#4BBFBF; --do:#F2CA50; --ti:#33291C; --cr:#FDF6E8;
  --vx:#1F8585; --vy:#D9A825;
  --ok:#578A44; --okbg:#E6F1E0; --er:#D93A3A; --erbg:#FBE2E0;
  --tql:#FDF0E9; --line:rgba(51,41,28,.12); --mut:#7d705c;
  --board-h:0px;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--cr); color:var(--ti); font-family:"Nunito Sans",system-ui,sans-serif; font-size:16px; line-height:1.6; -webkit-tap-highlight-color:transparent; }
button{ font:inherit; color:inherit; }
.frame{ max-width:560px; margin:0 auto; padding:0 16px 40px; }

/* ---------- top bar ---------- */
.top{ display:flex; align-items:center; justify-content:space-between; padding:14px 0 10px; }
.brand{ display:flex; align-items:center; gap:8px; font-family:Manrope,sans-serif; font-weight:800; letter-spacing:.2em; font-size:13px; }
.brand small{ font-family:"Nunito Sans"; font-weight:600; letter-spacing:0; color:var(--tp); font-size:12px; }
.nav{ display:flex; gap:6px; align-items:center; overflow-x:auto; padding:4px 0 12px; border-bottom:1px solid var(--line); scrollbar-width:none; }
.nav::-webkit-scrollbar{ display:none; }
.nav .intro-btn{ border:1.5px solid var(--tq); background:transparent; border-radius:999px; padding:5px 14px; font-family:Nunito; font-weight:800; font-size:14px; color:var(--tp); cursor:pointer; white-space:nowrap; }
.nav .intro-btn.on{ background:var(--tq); color:#fff; }
.pd{ width:34px; height:34px; flex-shrink:0; display:grid; place-items:center; cursor:pointer; background:none; border:none; position:relative; font-family:Nunito; font-weight:800; font-size:13px; color:var(--tp); }
.pd::before{ content:""; position:absolute; width:22px; height:22px; transform:rotate(45deg); border:1.5px solid var(--tq); background:#fff; border-radius:3px; }
.pd span{ position:relative; }
.pd.on::before{ background:var(--tq); }
.pd.on span{ color:#fff; }
.pd.done::before{ background:var(--tp); border-color:var(--tp); }
.pd.done span{ color:#fff; }
.pd.off{ opacity:.35; cursor:not-allowed; }
.pd:focus-visible,.nav .intro-btn:focus-visible,.btn:focus-visible,.opt:focus-visible{ outline:2px solid var(--tp); outline-offset:3px; }

/* ---------- intro / video ---------- */
.stage{ position:relative; overflow:hidden; touch-action:pan-y; user-select:none; }
.track{ display:flex; transition:transform .45s cubic-bezier(.3,.8,.3,1); }
.slide{ flex:0 0 100%; min-height:min(640px,78vh); padding:22px 4px 10px; display:flex; flex-direction:column; }
.slide h2{ font-family:Nunito; font-weight:900; font-size:clamp(30px,8vw,42px); line-height:1.08; margin:0 0 6px; letter-spacing:-.01em; }
.slide p.sub{ font-size:19px; margin:4px 0 0; color:#5b4f3d; max-width:30ch; }
.slide .art{ flex:1; display:flex; align-items:center; justify-content:center; padding:10px 0; }
.slide svg{ max-width:100%; height:auto; overflow:visible; }
.slide svg.mp-demo, .planehost svg{ overflow:hidden; }
.slide svg.mp-demo{ background:#fff; border-radius:10px; }
.kick{ font-family:Nunito; font-weight:800; color:var(--tp); font-size:15px; margin-bottom:4px; }
.ctrl{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0 4px; }
.pips{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; }
.pip{ width:9px; height:9px; transform:rotate(45deg); background:var(--tq); opacity:.25; border-radius:1px; transition:opacity .3s, background .3s; }
.pip.seen{ opacity:.65; }
.pip.on{ opacity:1; background:var(--tp); }
.arrow{ width:44px; height:44px; border-radius:50%; border:1.5px solid var(--tq); background:#fff; cursor:pointer; font-size:20px; color:var(--tp); display:grid; place-items:center; }
.arrow:disabled{ opacity:.3; cursor:default; }
.swipe-hint{ text-align:center; font-size:13px; color:var(--mut); margin-top:2px; }

/* reveal animations inside slides */
.rv{ opacity:0; }
.slide.on .rv{ animation:rvin .6s ease forwards; animation-delay:var(--d,0s); }
@keyframes rvin{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
.slide.on .draw{ stroke-dasharray:var(--len); stroke-dashoffset:var(--len); animation:draw 1.6s ease forwards; animation-delay:var(--d,0s); }
@keyframes draw{ to{ stroke-dashoffset:0 } }
.tag{ font-family:Nunito; font-weight:800; font-size:15px; }
.legend-row{ display:flex; flex-wrap:wrap; gap:6px 16px; font-size:15px; margin-top:6px; }
.legend-row b{ font-family:Nunito; font-weight:800; }

.mission4{ display:grid; grid-template-columns:repeat(2,1fr); gap:0; border-top:1px solid var(--line); margin-top:14px; }
.mission4 div{ padding:14px 6px 14px 0; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; font-family:Nunito; font-weight:800; font-size:19px; }
.mission4 div:nth-child(odd){ border-right:1px solid var(--line); }
.mission4 div:nth-child(even){ padding-left:14px; }
.mission4 i{ width:16px; height:16px; transform:rotate(45deg); background:var(--tq); flex-shrink:0; border-radius:2px; }
.mission4 small{ display:block; font-family:"Nunito Sans"; font-weight:400; font-size:13px; color:var(--mut); }
.cta{ margin-top:20px; background:var(--tq); color:#fff; border:none; border-radius:999px; padding:14px 26px; font-family:Nunito; font-weight:900; font-size:18px; cursor:pointer; align-self:flex-start; }
.cta:hover{ background:color-mix(in srgb, var(--tq) 85%, #33291C); }
.eslider{ width:100%; accent-color:var(--tp); margin-top:6px; }

/* ---------- board (sticky) ---------- */
.board{ position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--cr) 90%, transparent); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); padding-top:8px; border-bottom:1px solid var(--line); }
.mission{ display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.mi{ padding:7px 6px 7px 8px; border-right:1px solid var(--line); min-width:0; transition:background .4s; }
.mi:last-child{ border-right:none; }
.mi .lb{ display:flex; align-items:center; gap:7px; font-family:Nunito; font-weight:800; font-size:13px; white-space:nowrap; }
.mi .ck{ width:12px; height:12px; transform:rotate(45deg); border:1.5px solid var(--tq); border-radius:2px; flex-shrink:0; transition:background .3s; }
.mi .vl{ font-family:Nunito; font-weight:800; font-size:13.5px; line-height:1.25; color:var(--mut); min-height:34px; padding-top:2px; }
.mi.got .ck{ background:var(--tq); }
.mi.got .vl{ color:var(--tp); }
.mi.flash{ background:#fbeec4; }
.bankrow{ display:flex; gap:6px; align-items:center; padding:7px 0; overflow-x:auto; scrollbar-width:none; min-height:38px; }
.bankrow::-webkit-scrollbar{ display:none; }
.bankrow .bl{ font-size:12px; color:var(--mut); white-space:nowrap; font-weight:600; }
.clue{ white-space:nowrap; font-family:Nunito; font-weight:800; font-size:13.5px; padding:2px 10px; border-radius:999px; background:#fff; border:1px solid color-mix(in srgb, var(--tq) 50%, transparent); animation:pop .4s ease; }
@keyframes pop{ from{ transform:scale(.6); opacity:0 } to{ transform:none; opacity:1 } }
.planehost{ display:flex; gap:8px; position:relative; }
.planehost .pl{ flex:1; min-width:0; position:relative; }
.planehost svg{ width:100%; display:block; background:#fff; border-radius:10px; }
.pl .cap{ font-family:Nunito; font-weight:800; font-size:13px; text-align:center; margin-top:3px; }
.pl .mark{ position:absolute; top:8px; right:10px; font-family:Nunito; font-weight:900; font-size:22px; }
.pl.bad svg{ opacity:.55; }
.pl.bad .mark{ color:var(--er); }
.pl.good .mark{ color:var(--ok); }
.boardtools{ display:flex; justify-content:flex-end; padding:4px 0 6px; gap:12px; }
.linkbtn{ background:none; border:none; color:var(--tp); font-weight:700; font-size:13px; cursor:pointer; padding:2px 0; }
.board.min .planehost{ display:none; }

/* ---------- ruta (steps) ---------- */
.ruta{ position:relative; padding:18px 0 0 34px; }
.ruta::before{ content:""; position:absolute; left:10px; top:24px; bottom:0; width:3px; background:var(--tq); opacity:.25; border-radius:3px; }
.st{ position:relative; padding:0 0 26px; animation:stin .45s ease; }
@keyframes stin{ from{ opacity:0; transform:translateY(10px)} to{ opacity:1; transform:none } }
.st .mk{ position:absolute; left:-31px; top:3px; width:17px; height:17px; transform:rotate(45deg); background:#fff; border:2px solid var(--tq); border-radius:2px; }
.st.cur .mk{ background:var(--tq); box-shadow:0 0 0 5px color-mix(in srgb, var(--tq) 20%, transparent); }
.st.done .mk{ background:var(--tp); border-color:var(--tp); opacity:.65; }
.st.final .mk{ background:var(--do); border-color:var(--do); opacity:1; }
.st h4{ font-family:Nunito; font-weight:800; font-size:18px; margin:0 0 4px; line-height:1.3; }
.st p{ margin:4px 0; }
.st .note{ color:var(--mut); font-size:14.5px; }
.enun{ font-size:18px; line-height:1.75; }
.dato{ font-family:Nunito; font-weight:800; font-size:17px; border:none; background:var(--tql); color:var(--tp); border-bottom:2px dashed var(--tq); padding:0 6px; border-radius:6px 6px 0 0; cursor:pointer; white-space:nowrap; animation:hint 1.8s ease infinite; }
.dato.used{ background:transparent; border-bottom:2px solid var(--tq); animation:none; cursor:default; color:var(--ti); }
@keyframes hint{ 50%{ background:color-mix(in srgb, var(--tq) 28%, #fff) } }

.m{ font-family:Nunito; font-weight:700; font-size:21px; white-space:nowrap; overflow:hidden; padding:6px 0; line-height:1.2; display:block; }
.m.big{ font-size:26px; }
.m .ln{ display:inline; }
.fr{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .12em; }
.fr > span{ padding:0 .18em; line-height:1.15; }
.fr > span:first-child{ border-bottom:2px solid currentColor; }
.vx{ color:var(--vx); font-style:normal; font-weight:900; }
.vy{ color:var(--vy); font-style:normal; font-weight:900; }
sup{ font-size:.62em; }
.hl{ background:#fbeec4; border-radius:5px; padding:0 .15em; }
.hlt{ background:var(--tql); border-radius:5px; padding:0 .15em; }
.lines .ln2{ display:block; opacity:0; transform:translateY(4px); transition:.35s; }
.lines .ln2.show{ opacity:1; transform:none; }
.lines .why{ display:block; font-family:"Nunito Sans"; font-weight:400; font-size:14px; color:var(--mut); white-space:normal; }

.btn{ margin-top:8px; background:var(--tq); color:#fff; border:none; border-radius:999px; padding:9px 20px; font-family:Nunito; font-weight:800; font-size:16px; cursor:pointer; }
.btn:hover{ background:color-mix(in srgb, var(--tq) 85%, #33291C); }
.btn.ghost{ background:transparent; color:var(--tp); border:1.5px solid var(--tq); }
.btn[hidden]{ display:none; }
.opts{ display:flex; flex-direction:column; gap:0; margin-top:6px; border-top:1px solid var(--line); }
.opt{ text-align:left; background:none; border:none; border-bottom:1px solid var(--line); padding:11px 8px 11px 30px; cursor:pointer; position:relative; font-size:16px; line-height:1.4; transition:background .2s; }
.opt::before{ content:""; position:absolute; left:8px; top:16px; width:10px; height:10px; transform:rotate(45deg); border:1.5px solid var(--tq); border-radius:1px; }
.opt:hover{ background:color-mix(in srgb, var(--tq) 7%, transparent); }
.opt.ok{ background:var(--okbg); color:#2f5a23; }
.opt.ok::before{ background:var(--ok); border-color:var(--ok); }
.opt.bad{ background:var(--erbg); color:#8f2020; animation:shake .35s; }
.opt.bad::before{ border-color:var(--er); }
.opts.row{ flex-direction:row; border:none; gap:10px; }
.opts.row .opt{ flex:1; border:1.5px solid var(--line); border-radius:12px; padding:12px; text-align:center; font-family:Nunito; font-weight:800; }
.opts.row .opt::before{ display:none; }
.opts.row .opt svg{ display:block; margin:0 auto 4px; }
.opts[data-locked] .opt{ pointer-events:none; }
@keyframes shake{ 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

.fb{ margin-top:8px; padding:7px 12px; border-radius:8px; font-size:15px; display:none; }
.fb.ok{ display:block; background:var(--okbg); color:#2f5a23; }
.fb.bad{ display:block; background:var(--erbg); color:#8f2020; }
.fb b{ font-family:Nunito; font-weight:800; }

input.blank{ font-family:Nunito; font-weight:800; font-size:.95em; width:3.4em; text-align:center; border:none; border-bottom:2.5px solid var(--tq); background:var(--tql); border-radius:6px 6px 0 0; padding:1px 2px; color:var(--ti); outline:none; }
input.blank:focus{ border-bottom-color:var(--tp); background:color-mix(in srgb, var(--tq) 18%, #fff); }
input.blank.okv{ background:var(--okbg); border-bottom-color:var(--ok); }
input.blank.badv{ background:var(--erbg); border-bottom-color:var(--er); animation:shake .35s; }

.slot{ display:inline-flex; min-width:2.2em; height:1.35em; align-items:center; justify-content:center; border:2px dashed var(--tq); border-radius:7px; background:#fff; padding:0 .2em; transition:.2s; vertical-align:middle; }
.slot.over{ background:var(--tql); border-style:solid; }
.slot.fill{ border:2px solid var(--ok); background:var(--okbg); }
.slot.bad{ border-color:var(--er); background:var(--erbg); animation:shake .35s; }
.slot.sel-target{ box-shadow:0 0 0 3px color-mix(in srgb, var(--tq) 35%, transparent); }
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 2px; }
.chip{ font-family:Nunito; font-weight:800; font-size:16px; padding:5px 13px; background:#fff; border:1.5px solid var(--tq); border-radius:999px; cursor:grab; touch-action:none; user-select:none; }
.chip.sel{ background:var(--tq); color:#fff; }
.chip.used{ opacity:.3; pointer-events:none; }
.chip.cx{ border-color:var(--vx); color:var(--vx); }
.chip.cy{ border-color:var(--vy); color:#a57c0e; }
.chip.ghost{ position:fixed; z-index:100; pointer-events:none; cursor:grabbing; box-shadow:0 6px 16px rgba(51,41,28,.18); }
.draghelp{ font-size:13px; color:var(--mut); }

.stop{ border-left:4px solid var(--do); padding:4px 0 4px 12px; margin:6px 0; }
.stop b{ font-family:Nunito; font-weight:900; }
.win{ border-top:3px solid var(--do); border-bottom:1px solid var(--line); padding:12px 0; margin-top:6px; }
.win .m{ font-size:28px; }
.confetti{ position:fixed; inset:0; pointer-events:none; z-index:200; overflow:hidden; }
.confetti i{ position:absolute; top:-20px; width:11px; height:11px; transform:rotate(45deg); animation:fall 1.6s ease-in forwards; }
@keyframes fall{ to{ transform:translateY(105vh) rotate(405deg); opacity:.2 } }

.skip{ padding:40px 0; text-align:center; color:var(--mut); }
.wm{ margin-top:40px; padding-top:18px; border-top:1px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:4px; }
.wm .wmn{ font-family:Manrope; font-weight:800; letter-spacing:.2em; font-size:15px; }
.wm .wmt{ font-family:Manrope; font-weight:500; color:var(--tp); font-size:12px; letter-spacing:.06em; }


.modebar{ display:flex; align-items:stretch; gap:8px; padding:14px 0 0; }
.modebar .ml{ font-family:Nunito; font-weight:800; font-size:13px; color:var(--mut); align-self:center; margin-right:2px; }
.mp{ flex:1; text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:7px 12px; cursor:pointer; font-family:Nunito; font-weight:800; font-size:15px; line-height:1.2; }
.mp small{ display:block; font-family:"Nunito Sans"; font-weight:400; font-size:12px; color:var(--mut); }
.mp.on{ border-color:var(--tq); background:var(--tql); color:var(--tp); }
.mp.on[data-m="examen"]{ border-color:var(--ti); background:var(--ti); color:var(--cr); }
.mp.on[data-m="examen"] small{ color:#d9ccb3; }
.terms{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0; }
.term{ font-family:Nunito; font-weight:800; font-size:19px; padding:4px 10px; border-radius:8px; border:1.5px dashed var(--tq); background:#fff; cursor:pointer; }
.term.eq{ border:none; background:none; cursor:default; }
.term.g{ cursor:default; border-style:solid; }
.term.gx{ background:#dcefef; border-color:var(--vx); color:var(--vx); }
.term.gy{ background:#fbf0cf; border-color:var(--vy); color:#a57c0e; }
.term.gc{ background:#ece6da; border-color:var(--ti); text-decoration:line-through; opacity:.6; }
.term.nope{ animation:shake .35s; border-color:var(--er); }
.stats{ display:grid; grid-template-columns:repeat(3,1fr); border-bottom:1px solid var(--line); margin-bottom:8px; }
.stats div{ padding:8px 0; text-align:center; font-size:13px; color:var(--mut); border-right:1px solid var(--line); }
.stats div:last-child{ border-right:none; }
.stats b{ display:block; font-family:Nunito; font-weight:900; font-size:26px; color:var(--ti); }
.eltab div{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); font-size:15px; }
.eltab b{ font-family:Nunito; font-weight:800; }
.eltab span{ text-align:right; }
.exf .m{ padding:4px 0; }
.sqk{ margin-right:8px; }


/* ---------- montaña guía ---------- */
.say{ display:flex; align-items:flex-end; gap:10px; margin:10px 0 6px; }
.say .mtn{ flex-shrink:0; overflow:visible; }
.bub{ position:relative; background:#fff; border:2px solid var(--tql2); border-radius:16px; padding:9px 14px; font-family:Nunito; font-weight:800; font-size:16px; line-height:1.4; color:var(--ti); margin-bottom:6px; }
.bub::before{ content:""; position:absolute; left:-8px; bottom:14px; width:12px; height:12px; background:#fff; border-left:2px solid var(--tql2); border-bottom:2px solid var(--tql2); transform:rotate(45deg); }
.slide .bub{ font-size:18px; }
.mtn .br{ transform-origin:50% 100%; animation:breathe 3.4s ease-in-out infinite; }
@keyframes breathe{ 50%{ transform:scale(1.04,.96); } }
.slide.on .mtn .mdraw{ stroke-dasharray:1; stroke-dashoffset:1; animation:draw .9s ease forwards; }
.slide.on .mtn .mfill{ opacity:0; animation:fillin .5s ease .7s forwards; }
@keyframes fillin{ to{ opacity:1; } }
.slide.on .bub{ opacity:0; animation:rvin .5s ease .6s forwards; }
.fb.ok,.fb.bad{ display:flex; gap:10px; align-items:center; }
.fb .mtn{ flex-shrink:0; }
.lvl{ font-family:"Nunito Sans"; font-weight:600; font-size:14px; color:var(--mut); }
/* ---------- navegación por niveles ---------- */
.lg{ display:flex; flex-direction:column; align-items:center; padding:0 6px; border-left:1px solid var(--line); }
.lgd{ display:flex; gap:2px; }
.lgn{ font-size:10.5px; font-weight:700; color:var(--mut); margin-top:-2px; white-space:nowrap; }
.pd.l0::before{ border-color:color-mix(in srgb, var(--tq) 40%, transparent); }
.pd.l1::before{ border-color:color-mix(in srgb, var(--tq) 70%, transparent); }
.pd.l2::before{ border-color:var(--tp); }

@media (max-width:420px){
  .mi .lb{ font-size:12px; gap:5px; }
  .mi .vl{ font-size:12.5px; }
  .m{ font-size:19px; }
}


/* ---------- fondo del mundo de las Montañas ---------- */
.backdrop{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.42; }
.backdrop svg{ display:block; }
.frame{ position:relative; z-index:1; }


/* datos con tipo (recta): pendiente / punto */
.dato.km{ background:color-mix(in srgb, var(--tq) 14%, #fff); border-bottom-color:var(--tp); color:var(--tp); }
.dato.kp{ background:#FCF1CF; border-bottom-color:#D9A825; color:#7A5A06; }
.dato.km.used, .dato.kp.used{ background:transparent; color:var(--ti); }


.legend{ display:flex; flex-wrap:wrap; gap:4px 14px; justify-content:center; padding:5px 4px 0; font-size:12.5px; font-weight:700; color:var(--ti); }
.legend span{ display:flex; align-items:center; gap:6px; }
.legend i{ width:20px; height:0; display:inline-block; }


.cmp{ width:100%; border-collapse:collapse; font-size:14px; }
.cmp th{ font-family:Nunito; font-weight:800; font-size:12.5px; color:var(--mut); text-transform:none; letter-spacing:0; padding:6px 4px; }
.cmp td{ text-align:center; padding:9px 4px; font-size:18px; font-weight:900; font-family:Nunito; }
.cmp td:first-child{ text-align:left; font-size:16px; }
.cmp td.si{ color:var(--ok); } .cmp td.no{ color:#B9AE9A; }


/* ---------- arreglo: las diapositivas nunca más anchas que la pantalla ---------- */
.slide{ min-width:0; overflow:hidden; }
.slide .art, .slide .art *, .slide .say, .slide .bub{ min-width:0; }

<script>
/* ╔══════════════════════════════════════════════════════════╗
   ║ 1 · TEMA (mundo de las Montañas de las Formas)            ║
   ║ Cada tema de geometría analítica tiene su color.          ║
   ║ Gea (la mascota) y los colores pedagógicos de x, y,       ║
   ║ verde y rojo NO cambian con el tema.                      ║
   ╚══════════════════════════════════════════════════════════╝ */
const THEMES = {
  recta:          { nombre:'La recta',        acc:'#5E6E86', deep:'#3E4A5C', light:'#A9B4C4', tint:'#EEF1F5' }, // piedra
  circunferencia: { nombre:'La circunferencia', acc:'#7B57C2', deep:'#55378F', light:'#B9A3E3', tint:'#F3EEFB' }, // violeta
  parabola:       { nombre:'La parábola',     acc:'#B4458E', deep:'#823063', light:'#DB9CC4', tint:'#F9EEF5' }, // ciruela
  elipse:         { nombre:'La elipse',       acc:'#F2762E', deep:'#B5501A', light:'#F7A374', tint:'#FDF0E9' }, // naranja montaña
  hiperbola:      { nombre:'La hipérbola',    acc:'#3E72B8', deep:'#2A5088', light:'#9CB9E0', tint:'#EDF2FA' }, // azul noche
};
const TEMA = 'hiperbola';
const T = THEMES[(new URLSearchParams(location.search)).get('tema')] || THEMES[TEMA];
(r=>{ r.setProperty('--tq',T.acc); r.setProperty('--tp',T.deep); r.setProperty('--tql2',T.light); r.setProperty('--tql',T.tint); })(document.documentElement.style);
</script>
<script>
/* ╔═ 2 · MOTOR (compartido por todas las herramientas de geometría) ═╗ */
/* =========================================================
   Utilidades
   ========================================================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const h = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };
const NS = 'http://www.w3.org/2000/svg';

function iso(w){ return `<svg viewBox="0 0 64 64" width="${w}" height="${w}" aria-hidden="true">
<line x1="15" y1="49" x2="46" y2="18" stroke="#4BBFBF" stroke-opacity=".25" stroke-width="2.75" stroke-linecap="round"/>
<rect x="15" y="41" width="7.07" height="7.07" transform="rotate(45 18.5 44.5)" fill="#4BBFBF" fill-opacity=".35"/>
<rect x="24.5" y="28.5" width="9.9" height="9.9" transform="rotate(45 29.5 33.5)" fill="#4BBFBF" fill-opacity=".65"/>
<rect x="34.6" y="15.6" width="12.73" height="12.73" transform="rotate(45 41 22)" fill="#F2CA50"/></svg>`; }
$('#isoTop').innerHTML = iso(26); $('#isoWm').innerHTML = iso(34);

/* --- notación matemática --- */
const X = '<i class="vx">x</i>', Y = '<i class="vy">y</i>';
const fr = (n,d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const sq = s => `${s}<sup>2</sup>`;
const M = (html, cls='') => `<span class="m ${cls}"><span class="ln">${html}</span></span>`;
const blank = id => `<input class="blank" data-inp="${id}" autocomplete="off" aria-label="respuesta">`;
const slot = id => `<span class="slot" data-slot="${id}"></span>`;
const neg = v => String(v).replace('-', '−');
// ecuación ordinaria con números ya puestos (simplifica signos)
function par(v, c){ // (x − c)²  → ya simplificado
  if(c===0) return sq(v);
  return sq(`(${v} ${c>0?'−':'+'} ${Math.abs(c)})`);
}

/* ajusta ecuaciones para que nunca salten de línea */
function fit(root=document){
  $$('.m', root).forEach(m=>{
    const base = m.dataset.base ? +m.dataset.base : parseFloat(getComputedStyle(m).fontSize);
    m.dataset.base = base; m.style.fontSize = base+'px';
    let fs = base, guard=0;
    while(m.scrollWidth > m.clientWidth + 1 && fs > 11 && guard++<40){ fs -= 1; m.style.fontSize = fs+'px'; }
  });
}
window.addEventListener('resize', ()=>fit());

function parseNum(s){
  if(s==null) return NaN;
  s = String(s).trim().toLowerCase().replace(/−/g,'-').replace(/,/g,'.').replace(/\s+/g,'').replace(/ra[ií]z|sqrt/g,'√');
  if(!s) return NaN;
  let js = s.replace(/√\(([^()]+)\)/g,'Q($1)').replace(/√([\d.]+)/g,'Q($1)').replace(/([\d.)])(?=Q|\()/g,'$1*').replace(/\)(?=[\d.])/g,')*');
  if(!/^[\d.+\-*/()Q]*$/.test(js)) return NaN;
  try{ const v = Function('Q','return ('+js+')')(Math.sqrt); return (typeof v==='number' && isFinite(v)) ? v : NaN; }catch(e){ return NaN; }
}
const same = (a,b) => Math.abs(a-b) < 0.006*Math.max(1,Math.abs(b));

function confetti(){
  const c = h('div','confetti'); document.body.appendChild(c);
  const cols=['#F2CA50',T.acc,T.deep,'#F2CA50'];
  for(let i=0;i<34;i++){ const d=document.createElement('i'); d.style.left=Math.random()*100+'vw'; d.style.background=cols[i%4]; d.style.animationDelay=(Math.random()*.5)+'s'; d.style.opacity=.9; c.appendChild(d); }
  setTimeout(()=>c.remove(), 2400);
}

/* =========================================================
   Plano cartesiano
   ========================================================= */
const PT = { // estilos de puntos: C centro · V vértice · B extremo eje menor · F foco · P punto dado
  C:{shape:'d', r:6, fill:'#33291C'},
  V:{shape:'d', r:7, fill:T.acc},
  B:{shape:'d', r:6, fill:T.acc, op:.55},
  F:{shape:'c', r:5.5, fill:'#fff', stroke:T.deep},
  P:{shape:'c', r:6, fill:'#F2CA50', stroke:'#33291C'},
};
function renderPlane(svg, st){
  const [x0,x1,y0,y1] = st.view;
  const W = st.W || 520, H = st.H || 300, pad = 14;
  const s = Math.min((W-2*pad)/(x1-x0), (H-2*pad)/(y1-y0));
  const ox = W/2 - s*(x0+x1)/2, oy = H/2 + s*(y0+y1)/2;
  const tx = x => ox + s*x, ty = y => oy - s*y;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let g = '';
  const range = Math.max(x1-x0, y1-y0);
  const step = range<=14?1: range<=30?2:5;
  const lab = range<=14?2: step;
  const xa = Math.ceil((0-ox)/s), xb = Math.floor((W-ox)/s);
  const ya = Math.ceil((oy-H)/s), yb = Math.floor(oy/s);
  for(let i=Math.ceil(xa/step)*step;i<=xb;i+=step) g += `<line x1="${tx(i)}" y1="0" x2="${tx(i)}" y2="${H}" stroke="${T.acc}" stroke-opacity=".13"/>`;
  for(let j=Math.ceil(ya/step)*step;j<=yb;j+=step) g += `<line x1="0" y1="${ty(j)}" x2="${W}" y2="${ty(j)}" stroke="${T.acc}" stroke-opacity=".13"/>`;
  g += `<line x1="0" y1="${ty(0)}" x2="${W}" y2="${ty(0)}" stroke="#33291C" stroke-opacity=".45" stroke-width="1.2"/>`;
  g += `<line x1="${tx(0)}" y1="0" x2="${tx(0)}" y2="${H}" stroke="#33291C" stroke-opacity=".45" stroke-width="1.2"/>`;
  for(let i=Math.ceil(xa/lab)*lab;i<=xb;i+=lab) if(i!==0) g += `<text x="${tx(i)}" y="${ty(0)+13}" font-size="10" fill="#9c8f78" text-anchor="middle" font-family="Nunito Sans">${neg(i)}</text>`;
  for(let j=Math.ceil(ya/lab)*lab;j<=yb;j+=lab) if(j!==0) g += `<text x="${tx(0)-5}" y="${ty(j)+3.5}" font-size="10" fill="#9c8f78" text-anchor="end" font-family="Nunito Sans">${neg(j)}</text>`;
  g += `<text x="${W-6}" y="${ty(0)-6}" font-size="13" font-weight="900" fill="#1F8585" text-anchor="end" font-family="Nunito">x</text>`;
  g += `<text x="${tx(0)+7}" y="13" font-size="13" font-weight="900" fill="#D9A825" font-family="Nunito">y</text>`;

  const e = st.ell;
  if(e && e.mode){
    const cp = curvePaths(e, st.view, tx, ty);
    if(e.mode==='ghost') cp.forEach(c=> g += `<path d="${c.d}" fill="${c.closed?T.acc:'none'}" fill-opacity=".05" stroke="${c.aux?'#33291C':T.acc}" stroke-opacity="${c.aux?.25:.6}" stroke-width="2" stroke-dasharray="6 6"/>`);
    else cp.forEach(c=> g += c.aux
      ? `<path d="${c.d}" fill="none" stroke="#33291C" stroke-opacity=".3" stroke-width="1.5" stroke-dasharray="5 5"/>`
      : `<path class="grow" pathLength="1" d="${c.d}" fill="${c.closed?T.acc:'none'}" fill-opacity=".09" stroke="${T.acc}" stroke-width="3" stroke-linecap="round" style="stroke-dasharray:1;stroke-dashoffset:${st.drawn?0:1};transition:stroke-dashoffset 1.4s ease"/>`);
  }
  (st.segs||[]).forEach(sg=>{
    const col = sg.col || '#33291C';
    g += `<line x1="${tx(sg.a[0])}" y1="${ty(sg.a[1])}" x2="${tx(sg.b[0])}" y2="${ty(sg.b[1])}" stroke="${col}" stroke-width="${sg.w||2.5}" ${sg.dash?'stroke-dasharray="5 5"':''} stroke-linecap="round" stroke-opacity="${sg.op||.85}"/>`;
    if(sg.lab){ const mx=(tx(sg.a[0])+tx(sg.b[0]))/2 + (sg.lo?sg.lo[0]:0), my=(ty(sg.a[1])+ty(sg.b[1]))/2 + (sg.lo?sg.lo[1]:-8);
      g += `<text x="${mx}" y="${my}" font-size="14" font-weight="900" fill="${col}" text-anchor="middle" font-family="Nunito" paint-order="stroke" stroke="#fff" stroke-width="4">${sg.lab}</text>`; }
  });
  (st.pts||[]).forEach(p=>{
    const t = PT[p.t] || PT.P, X0=tx(p.x), Y0=ty(p.y);
    const cls = p.fresh ? 'class="fresh"' : '';
    if(t.shape==='d') g += `<rect ${cls} x="${X0-t.r}" y="${Y0-t.r}" width="${2*t.r}" height="${2*t.r}" transform="rotate(45 ${X0} ${Y0})" fill="${t.fill}" fill-opacity="${t.op||1}" ${p.faint?'opacity=".45"':''}/>`;
    else g += `<circle ${cls} cx="${X0}" cy="${Y0}" r="${t.r}" fill="${t.fill}" stroke="${t.stroke}" stroke-width="2" ${p.faint?'opacity=".45"':''}/>`;
    if(p.l){ const lo = p.lo || [0,-13];
      const isI = v => Math.abs(v-Math.round(v))<1e-9;
      const txt = p.l + (p.nc || !isI(p.x) || !isI(p.y) ? '' : `(${neg(p.x)}, ${neg(p.y)})`);
      const anc = lo[0]<0?'end':lo[0]>0?'start':'middle';
      g += `<text ${cls} x="${X0+lo[0]}" y="${Y0+lo[1]}" font-size="13" font-weight="800" fill="#33291C" font-family="Nunito" text-anchor="${anc}" paint-order="stroke" stroke="#fff" stroke-width="4" ${p.faint?'opacity=".6"':''}>${txt}</text>`; }
  });
  svg.innerHTML = g + `<style>.fresh{animation:pp .6s ease} @keyframes pp{0%{opacity:0}50%{opacity:1}}</style>`;
  const grs = svg.querySelectorAll('.grow');
  if(grs.length && !st.drawn){ requestAnimationFrame(()=>requestAnimationFrame(()=>{ grs.forEach(gr=>gr.style.strokeDashoffset=0); })); st.drawn = true; }
  (st.pts||[]).forEach(p=>p.fresh=false);
}


/* Curvas que sabe dibujar el plano. Cada una es un objeto con type:
   line      {type:'line', m, b}  ó  {type:'line', x:c} (vertical)
   circle    {type:'circle', h, k, r2}
   ellipse   {type:'ellipse', h, k, a2, b2, v}        (v = eje mayor vertical)
   parabola  {type:'parabola', h, k, p, v}            (v: (x−h)² = 4p(y−k) · si no: (y−k)² = 4p(x−h))
   hyperbola {type:'hyperbola', h, k, a2, b2, v}      (v = eje transverso vertical; dibuja asíntotas)  */
function curvePaths(e, view, tx, ty){
  const [x0,x1,y0,y1] = view, mx=(x1-x0)*.6, my=(y1-y0)*.6;
  const inV = (x,y)=> x>x0-mx && x<x1+mx && y>y0-my && y<y1+my;
  const P = pts => pts.map((p,i)=>`${i?'L':'M'}${tx(p[0]).toFixed(1)} ${ty(p[1]).toFixed(1)}`).join(' ');
  const type = e.type || 'ellipse', N = 240, out = [];
  if(type==='ellipse' || type==='circle'){
    const rx = type==='circle'? Math.sqrt(e.r2) : Math.sqrt(e.v? e.b2 : e.a2);
    const ry = type==='circle'? Math.sqrt(e.r2) : Math.sqrt(e.v? e.a2 : e.b2);
    const pts=[]; for(let i=0;i<=N;i++){ const t=2*Math.PI*i/N; pts.push([e.h+rx*Math.cos(t), e.k+ry*Math.sin(t)]); }
    out.push({d:P(pts)+' Z', closed:true});
  } else if(type==='parabola'){
    const pts=[]; const span = Math.max(x1-x0,y1-y0)*1.2;
    for(let i=0;i<=N;i++){ const u = -span + 2*span*i/N; const w = u*u/(4*e.p);
      const p = e.v? [e.h+u, e.k+w] : [e.h+w, e.k+u]; if(inV(p[0],p[1])) pts.push(p); }
    out.push({d:P(pts)});
  } else if(type==='hyperbola'){
    const a=Math.sqrt(e.a2), b=Math.sqrt(e.b2), T0 = 3.2;
    [1,-1].forEach(sg=>{ const pts=[]; for(let i=0;i<=N;i++){ const t=-T0+2*T0*i/N;
        const p = e.v? [e.h+b*Math.sinh(t), e.k+sg*a*Math.cosh(t)] : [e.h+sg*a*Math.cosh(t), e.k+b*Math.sinh(t)];
        if(inV(p[0],p[1])) pts.push(p); } out.push({d:P(pts)}); });
    const m = e.v? a/b : b/a, L = Math.max(x1-x0,y1-y0);
    if(!e.noAsym) [m,-m].forEach(mm=> out.push({aux:true, d:P([[e.h-L, e.k-mm*L],[e.h+L, e.k+mm*L]])}));
  } else if(type==='line'){
    if(e.x!=null) out.push({d:P([[e.x,y0-my],[e.x,y1+my]])});
    else out.push({d:P([[x0-mx, e.m*(x0-mx)+e.b],[x1+mx, e.m*(x1+mx)+e.b]])});
  }
  return out;
}
/* Puntos notables de cada curva (se muestran tenues al terminar un problema) */
function elementsOf(e){
  const type = e.type || 'ellipse', pts = [];
  if(type==='ellipse' || type==='hyperbola'){
    const a=Math.sqrt(e.a2), b=Math.sqrt(e.b2), c=Math.sqrt(type==='ellipse'? e.a2-e.b2 : e.a2+e.b2);
    const along = d => e.v? [e.h, e.k+d] : [e.h+d, e.k], across = d => e.v? [e.h+d, e.k] : [e.h, e.k+d];
    pts.push([...along(a),'V'],[...along(-a),'V'],[...along(c),'F'],[...along(-c),'F'],[e.h,e.k,'C']);
    if(type==='ellipse') pts.push([...across(b),'B'],[...across(-b),'B']);
  } else if(type==='circle') pts.push([e.h,e.k,'C']);
  else if(type==='parabola') pts.push([e.h,e.k,'V'], e.v? [e.h,e.k+e.p,'F'] : [e.h+e.p,e.k,'F']);
  return pts;
}
/* =========================================================
   MASCOTA: Gea, la montaña del mundo de las Formas
   ========================================================= */
function mountain(mood='happy', size=80){
  const body = 'M11 89 L47.5 16 Q50 12 52.5 16 L91 89 Z';
  const eye = (x)=>{
    if(mood==='joy') return `<path d="M${x-4} 59 Q${x} 54 ${x+4} 59" stroke="#33291C" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
    if(mood==='wink' && x>50) return `<path d="M${x-4} 58 Q${x} 61 ${x+4} 58" stroke="#33291C" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
    const dy = mood==='think' ? -2 : 0;
    return `<ellipse cx="${x}" cy="${58+dy}" rx="3.4" ry="4.2" fill="#33291C"/><circle cx="${x+1.2}" cy="${56.3+dy}" r="1.2" fill="#fff"/>`;
  };
  const mouth = mood==='joy' ? '<path d="M43 66 Q50 76 57 66 Z" fill="#8C3A12"/>'
    : mood==='think' ? '<ellipse cx="51" cy="68" rx="2.6" ry="2.2" fill="#8C3A12"/>'
    : '<path d="M44.5 66 Q50 71.5 55.5 66" stroke="#33291C" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
  return `<svg class="mtn" viewBox="0 0 102 92" role="img" aria-label="Gea" width="${size}" height="${size*92/102}" aria-hidden="true"><g class="br">
    <g class="mfill">
      <path d="M2 89 L28.5 44 L55 89 Z" fill="#F7A374"/>
      <path d="${body}" fill="#F2762E"/>
      <path d="M38.5 34 L47.5 16 Q50 12 52.5 16 L62 35 L56.5 30.5 L50.5 37 L44.5 30.5 Z" fill="#fff"/>
      <ellipse cx="37" cy="66" rx="4.5" ry="2.6" fill="#FFC2A3" opacity=".9"/><ellipse cx="65" cy="66" rx="4.5" ry="2.6" fill="#FFC2A3" opacity=".9"/>
      ${eye(43)}${eye(58)}${mouth}
    </g>
    <path class="mdraw" pathLength="1" d="${body}" fill="none" stroke="#B5501A" stroke-width="3" stroke-linejoin="miter" stroke-miterlimit="6"/>
  </g></svg>`;
}
function say(text, mood='happy', size=56){ return `<div class="say">${mountain(mood,size)}<div class="bub">${text}</div></div>`; }


/* =========================================================
   FONDO: el mundo de las Montañas de las Formas (siempre naranja,
   no cambia con el tema) · cordilleras + villa griega, muy tenue
   ========================================================= */
function backdropSVG(){
  const O='#EBCDAE', L='#F3E0CA', D='#D9B48F'; // naranja del mundo, aclarado hacia crema
  const peak = (x,base,w,hgt,fill,snow=true) => {
    const top=base-hgt, s=hgt*.22;
    let g = `<path d="M${x-w/2} ${base} L${x} ${top} L${x+w/2} ${base} Z" fill="${fill}"/>`;
    g += `<g stroke="${D}" stroke-width="2.5" opacity=".45">${[.35,.5,.65].map(f=>{ const px=x+w/2*f*.55, py=top+hgt*f; return `<line x1="${px}" y1="${py}" x2="${px+22}" y2="${py-18}"/>`; }).join('')}</g>`;
    return g;
  };
  const house = (x,y,w,hh,dome) => `<rect x="${x}" y="${y-hh}" width="${w}" height="${hh}" fill="${D}"/>`
    + (dome ? `<path d="M${x+w*.15} ${y-hh} A${w*.35} ${w*.35} 0 0 1 ${x+w*.85} ${y-hh} Z" fill="${O}"/><line x1="${x+w/2}" y1="${y-hh-w*.35}" x2="${x+w/2}" y2="${y-hh-w*.35-12}" stroke="${D}" stroke-width="2"/>` : '')
    + `<rect x="${x+w*.38}" y="${y-hh*.45}" width="${w*.24}" height="${hh*.45}" fill="${L}"/>`;
  const temple = (x,y) => { let g=`<path d="M${x-10} ${y-92} L${x+90} ${y-122} L${x+190} ${y-92} Z" fill="${D}"/><rect x="${x-6}" y="${y-92}" width="192" height="10" fill="${D}"/>`;
    for(let i=0;i<7;i++) g += `<rect x="${x+2+i*28}" y="${y-82}" width="10" height="72" fill="${D}"/>`;
    return g + `<rect x="${x-10}" y="${y-10}" width="200" height="10" fill="${D}"/>`; };
  const cypress = (x,y,hh) => `<path d="M${x} ${y} L${x-9} ${y-hh*.35} L${x} ${y-hh} L${x+9} ${y-hh*.35} Z" fill="${D}"/>`;

  if(K.has('imag')){ segs.push({a:[0,-HB],b:[0,HB],col:T.deep,w:3,dash:true,op:.6}); P(0,HB,'B','B',[12,-6],'imag'); P(0,-HB,'B','B′',[12,14],'imag'); segs.push({a:[-.45,0],b:[-.45,HB],lab:'b',col:T.deep,w:2.5,lo:[-12,0]});
    RECT.forEach((p,i)=>segs.push({a:p,b:RECT[(i+1)%4],col:'#9AA3B2',w:1.5,dash:true})); }
  if(K.has('F')){ P(-HC,0,'F','F′',[0,22],'F'); P(HC,0,'F','F',[0,22],'F'); segs.push({a:[0,0],b:[HA,HB],lab:'c',col:'#33291C',w:2.5,lo:[-8,-8]}); }

  return { view:VH, H:300, pts, segs, ell:{...HYP, mode:'solid', noAsym:!K.has('asin')}, drawn: !N.has('curve'), ...extra };
}

/* ╔═ MOTOR (continuación): intro y problemas ═╗ */
let slideIdx = 0, seen = new Set([0]);
function renderIntro(){
  const app = $('#app'); app.innerHTML='';
  const stage = h('div','stage'); const track = h('div','track');
  SLIDES.forEach((S,i)=>{
    const sl = h('section','slide'); sl.setAttribute('aria-roledescription','diapositiva');
    sl.innerHTML = `<h2>${S.t}</h2>${say(S.s, S.m, 74)}<div class="art">${S.art}</div>${S.foot?`<div class="rv" style="--d:1.2s;text-align:center;font-size:17px">${S.foot}</div>`:''}`;
    track.appendChild(sl);
  });
  stage.appendChild(track); app.appendChild(stage);
  const ctrl = h('div','ctrl');
  ctrl.innerHTML = `<button class="arrow" id="prv" aria-label="Anterior">‹</button><div class="pips" id="pips"></div><button class="arrow" id="nxt" aria-label="Siguiente">›</button>`;
  app.appendChild(ctrl);
  app.appendChild(h('div','swipe-hint','Desliza o usa las flechas'));
  $('#prv').onclick=()=>goSlide(slideIdx-1); $('#nxt').onclick=()=>goSlide(slideIdx+1);
  // swipe
  let sx=null, sy=null;
  stage.addEventListener('pointerdown',e=>{ if(e.target.closest('input,button')) return; sx=e.clientX; sy=e.clientY; });
  stage.addEventListener('pointerup',e=>{ if(sx==null) return; const dx=e.clientX-sx, dy=e.clientY-sy; sx=null; if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)) goSlide(slideIdx + (dx<0?1:-1)); });
  SLIDES.forEach((S,i)=>{ if(S.init) S.init($$('.slide')[i]); });
  $$('[data-practicar]').forEach(b=> b.onclick = ()=> openProblem(ORDER[0]));
  goSlide(slideIdx, true);
}
function goSlide(i, instant){
  if(i<0 || i>=SLIDES.length) return;
  slideIdx = i; seen.add(i);
  const track = $('.track'); if(!track) return;
  if(instant){ track.style.transition='none'; requestAnimationFrame(()=>track.style.transition=''); }
  track.style.transform = `translateX(${-100*i}%)`;
  $$('.slide').forEach((s,j)=>{ s.classList.remove('on'); if(j===i){ void s.offsetWidth; s.classList.add('on'); } });
  $('#pips').innerHTML = SLIDES.map((_,j)=>`<span class="pip ${j===i?'on':seen.has(j)?'seen':''}"></span>`).join('');
  $('#prv').disabled = i===0; $('#nxt').disabled = i===SLIDES.length-1;
  requestAnimationFrame(()=>fit($$('.slide')[i]));
}
document.addEventListener('keydown',e=>{
  if(!$('.track')) return; if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight') goSlide(slideIdx+1); if(e.key==='ArrowLeft') goSlide(slideIdx-1);
});

const levelOf = pos => LEVELS.findIndex(l=>pos<=l.to);
let MODE = 'guiado';

try{ done = new Set(JSON.parse(localStorage.getItem('eurema-'+TOOL.id+'-done')||'[]')); }catch(e){}
const saveDone = ()=>{ try{ localStorage.setItem('eurema-'+TOOL.id+'-done', JSON.stringify([...done])); }catch(e){} };

let S = null; // estado del problema actual

function renderNav(active){
  const nav = $('#nav'); nav.innerHTML='';
  const ib = h('button','intro-btn'+(active==='intro'?' on':''),'▶ '+TOOL.introLabel); ib.onclick=()=>{ slideIdx=0; showIntro(); };
  nav.appendChild(ib);
  let grp = null, gl = -1;
  ORDER.forEach((n,pos)=>{
    const L = levelOf(pos);
    if(L!==gl){ gl=L; grp = h('div','lg l'+L); grp.appendChild(h('div','lgd')); grp.appendChild(h('div','lgn',LEVELS[L].name)); nav.appendChild(grp); }
    const b = h('button','pd l'+L+(n===active?' on':'')+(done.has(n)&&n!==active?' done':''),`<span>${pos+1}</span>`);
    b.setAttribute('aria-label', `Problema ${pos+1}, nivel ${LEVELS[L].name.toLowerCase()}`);
    b.onclick = ()=> openProblem(n);
    $('.lgd',grp).appendChild(b);
  });
}
function showIntro(){ S=null; renderNav('intro'); renderIntro(); window.scrollTo({top:0}); }

function openProblem(n, mode){
  if(mode) MODE = mode;
  const def = PROBLEMS[n];
  renderNav(n);
  const app = $('#app'); app.innerHTML='';
  const board = h('div','board');
  board.innerHTML = `
    <div class="mission" style="grid-template-columns:repeat(${MISSION.length},1fr)">
      ${MISSION.map(x=>`<div class="mi" data-k="${x.k}"><div class="lb"><span class="ck"></span>${x.l}</div><div class="vl">—</div></div>`).join('')}
    </div>
    <div class="bankrow" id="bank"><span class="bl">Pistas:</span></div>
    <div class="planehost" id="ph"></div>
    <div class="boardtools"><button class="linkbtn" id="tgl">Ocultar plano</button><button class="linkbtn" id="rst">Reiniciar</button></div>`;
  app.appendChild(board);
  const mb = h('div','modebar');
  mb.innerHTML = `<span class="ml">Modo</span><button class="mp ${MODE==='guiado'?'on':''}" data-m="guiado">Guiado<small>paso a paso con preguntas</small></button><button class="mp ${MODE==='examen'?'on':''}" data-m="examen">Examen<small>solo la misión, sin ayudas</small></button>`;
  app.appendChild(mb);
  $$('.mp',mb).forEach(x=> x.onclick = ()=>{ if(x.dataset.m!==MODE) openProblem(n, x.dataset.m); });
  const ruta = h('div','ruta'); app.appendChild(ruta);
  S = { n, def, board, ruta, mode:MODE, t0:Date.now(), errs:0, planes:[{ view:def.view, pts:[], segs:[], ell:null, H:def.H||300 }], stepIdx:-1, steps:[], checks:{}, dual:false };
  $('#tgl').onclick = ()=>{ board.classList.toggle('min'); $('#tgl').textContent = board.classList.contains('min')?'Mostrar plano':'Ocultar plano'; };
  $('#rst').onclick = ()=> openProblem(n);
  if(def.noPlane){ board.classList.add('min'); $('#tgl').style.display='none'; $('#ph').style.display='none'; }
  drawPlanes();
  // construir lista completa de pasos: datos → orientación → pasos → final
  if(MODE==='examen' && !def.noExam){
    const build = def.examBuild || def.steps.find(s=>s.isBuild);
    S.steps = [ dataStep(def), ...EXAM_STEPS(def), ...(build?[build]:[]), ...(def.examAfter||[]), finalStep(def) ];
  } else {
    S.steps = [ dataStep(def), ...(def.orient && !def.orientLate ? [orientStep(def)] : []), ...def.steps.map(s=> s.t==='orientHere'? orientStep(def) : s), finalStep(def) ];
  }
  window.scrollTo({top:0});
  nextStep();
}

/* --- API que usan los pasos --- */
const API = {
  check(k, val){ S.checks[k]=val; const mi = $(`.mi[data-k="${k}"]`, S.board); mi.classList.add('got','flash'); $('.vl',mi).innerHTML = val.replace(' · ','<br>'); setTimeout(()=>mi.classList.remove('flash'),900); },
  bank(txt){ const c = h('span','clue',txt); $('#bank').appendChild(c); c.scrollIntoView({block:'nearest',inline:'end',behavior:'smooth'}); },
  pt(x,y,t,l,lo,pi=0){ S.planes[pi].pts.push({x,y,t,l,lo,fresh:true}); drawPlanes(); },
  seg(a,b,lab,col,opt={},pi=0){ S.planes[pi].segs.push({a,b,lab,col,...opt}); drawPlanes(); },
  clearSegs(pi=0){ S.planes[pi].segs=[]; drawPlanes(); },
  ghost(pi=0, e){ const E = e || S.def.curve || S.def.ell; S.planes[pi].ell = {...E, mode:'ghost'}; drawPlanes(); },
  solid(pi=0, e){ const E = e || S.def.curve || S.def.ell; S.planes[pi].ell = {...E, mode:'solid'}; S.planes[pi].drawn=false; drawPlanes(); },
  full(){ // muestra tenues los puntos notables de la curva final
    const e = S.def.curve || S.def.ell, P = S.planes[0];
    if(!e){ if(!S.def.keepSegs) P.segs=[]; drawPlanes(); return; }
    elementsOf(e).forEach(([x,y,t])=>{ if(!P.pts.some(p=>same(p.x,x)&&same(p.y,y))) P.pts.push({x,y,t,faint:true}); });
    if(!S.def.keepSegs) P.segs=[]; this.solid(); },
  rmSeg(id, pi=0){ S.planes[pi].segs = S.planes[pi].segs.filter(s=>s.id!==id); drawPlanes(); },
  unlegend(lab, pi=0){ const P=S.planes[pi]; P.legend=(P.legend||[]).filter(l=>l.lab!==lab); drawPlanes(); },
  legend(lab, col, dash=false, pi=0){ const P=S.planes[pi]; P.legend = P.legend||[]; const e=P.legend.find(l=>l.lab===lab); if(e){ e.col=col; e.dash=dash; } else P.legend.push({lab,col,dash}); drawPlanes(); },
  setPlanes(arr){ S.planes = arr; drawPlanes(); },
};
function drawPlanes(){
  const host = $('#ph'); if(!host) return; host.innerHTML='';
  S.planes.forEach((P,i)=>{
    const d = h('div','pl'+(P.mark==='bad'?' bad':P.mark==='good'?' good':''));
    const svg = document.createElementNS(NS,'svg'); d.appendChild(svg);
    if(P.cap) d.appendChild(h('div','cap',P.cap));
    if(P.legend && P.legend.length) d.appendChild(h('div','legend', P.legend.map(l=>`<span><i style="border-top:3px ${l.dash?'dashed':'solid'} ${l.col}"></i>${l.lab}</span>`).join('')));
    if(P.mark) d.appendChild(h('div','mark',P.mark==='bad'?'✗':'✓'));
    host.appendChild(d); renderPlane(svg,P);
  });
  document.documentElement.style.setProperty('--board-h', S.board.offsetHeight+'px');
}

function nextStep(){
  const prev = $('.st.cur', S.ruta); if(prev){ prev.classList.remove('cur'); prev.classList.add('done'); }
  S.stepIdx++;
  const step = S.steps[S.stepIdx]; if(!step) return;
  const el = h('div','st cur'); el.appendChild(h('span','mk'));
  const body = h('div','sb'); el.appendChild(body);
  S.ruta.appendChild(el);
  RENDER[step.t](step, body, el);
  fit(el);
  // desplazar para que el paso nuevo quede visible bajo el tablero
  if(S.stepIdx>0) setTimeout(()=>{
    const bh = S.board.getBoundingClientRect().height;
    const top = el.getBoundingClientRect().top + window.scrollY - bh - 14;
    window.scrollTo({top, behavior:'smooth'});
  }, 60);
}
function finish(step, body){
  if(step.after){ const a = h('div','',typeof step.after==='function'?step.after():step.after); body.appendChild(a); fit(a); }
  if(step.done) step.done(API);
  if(step.auto===false) return;
  const b = h('button','btn',step.next||'Continuar'); body.appendChild(b); b.focus({preventScroll:true});
  b.onclick = ()=>{ b.remove(); nextStep(); };
}
function feedback(body, ok, html){
  if(!ok && S && S.mode==='examen') S.errs++;
  let f = $(':scope > .fb', body); if(!f){ f=h('div','fb'); body.appendChild(f); }
  f.className = 'fb '+(ok?'ok':'bad'); f.innerHTML = `${mountain(ok?'happy':'think',34)}<div>${html}</div>`; fit(f);
}

function sqrtKey(body, inps){
  let last = inps[0];
  inps.forEach(i=> i.addEventListener('focus',()=> last=i));
  const k = h('button','btn ghost sqk','Insertar √'); k.type='button';
  k.onpointerdown = e=> e.preventDefault();
  k.onclick = ()=>{ if(!last || last.disabled) last = inps.find(i=>!i.disabled); if(!last) return; const p = last.selectionStart ?? last.value.length; last.value = last.value.slice(0,p)+'√'+last.value.slice(p); last.focus(); last.setSelectionRange(p+1,p+1); };
  body.appendChild(k);
}
/* --- tipos de pasos --- */
const RENDER = {
  data(step, body){
    const pos = ORDER.indexOf(S.n);
    body.innerHTML = `<h4>Problema ${pos+1} <span class="lvl">· Nivel ${LEVELS[levelOf(pos)].name.toLowerCase()}${S.def.guia?` · guía #${S.def.guia}`:''}</span></h4><div class="enun"></div>${say(S.mode==='examen' ? 'Modo examen: yo solo te acompaño. Toca los datos y luego resuelve tú. ¡Tú puedes!' : 'Toca cada dato y lo ubico en el plano con sus coordenadas.', S.mode==='examen'?'wink':'happy', 50)}`;
    let txt = step.enun; step.datos.forEach((d,i)=>{ txt = txt.replace(`{${i}}`, `<button class="dato${d.kind?' k'+d.kind:''}" data-i="${i}">${d.lab}</button>`); });
    $('.enun',body).innerHTML = txt;
    let left = step.datos.length;
    if(!left){ $('.say',body) && $('.say',body).remove(); finish(step, body); return; }
    $$('.dato',body).forEach(b=> b.onclick = ()=>{
      if(b.classList.contains('used')) return; b.classList.add('used');
      const d = step.datos[+b.dataset.i];
      (d.pts||[]).forEach(p=> API.pt(p.x,p.y,p.t,p.l,p.lo));
      if(d.bank) API.bank(d.bank);
      if(d.check) API.check(d.check[0], d.check[1]);
      if(d.act) d.act(API);
      if(--left===0){ feedback(body,true, step.okMsg || '<b>¡Datos en el plano!</b>'); finish(step, body); }
    });
  },
  mc(step, body){
    body.innerHTML = `${step.lead?`<p>${step.lead}</p>`:''}<h4>${step.q}</h4><div class="opts ${step.row?'row':''}"></div>`;
    const box = $('.opts',body);
    step.opts.forEach(o=>{
      const b = h('button','opt',o.h); box.appendChild(b);
      b.onclick = ()=>{
        if(o.ok){ b.classList.add('ok'); box.dataset.locked=1; feedback(body,true,o.fb||step.okMsg||'<b>¡Exacto!</b>'); finish(step, body); }
        else { b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad'); feedback(body,false,o.fb||'Mmm, no. Piénsalo otra vez.'); }
      };
    });
    fit(body);
  },
  info(step, body){ body.innerHTML = step.html; fit(body); finish(step, body); },
  reveal(step, body){
    const lines = typeof step.lines==='function' ? step.lines() : step.lines;
    body.innerHTML = `${step.lead||''}<div class="lines">${lines.map(l=>`<span class="ln2">${typeof l==='string'?M(l):M(l.m)+(l.why?`<span class="why">${l.why}</span>`:'')}</span>`).join('')}</div>`;
    const ls = $$('.ln2',body); let i=0;
    const show = ()=>{ ls[i].classList.add('show'); fit(ls[i]); i++; };
    show();
    const b = h('button','btn ghost','Siguiente línea'); body.appendChild(b);
    b.onclick = ()=>{ show(); if(i>=ls.length){ b.remove(); finish(step, body); } };
    if(ls.length===1){ b.remove(); finish(step, body); }
  },
  input(step, body){
    body.innerHTML = `${step.lead||''}${M(step.m)}${step.tail||''}`;
    const inps = $$('input.blank',body);
    if(step.sqrt) sqrtKey(body, inps);
    const b = h('button','btn','Verificar'); body.appendChild(b);
    inps.forEach(inp=> inp.addEventListener('keydown',e=>{ if(e.key==='Enter') b.click(); }));
    setTimeout(()=>inps[0] && inps[0].focus({preventScroll:true}), 400);
    b.onclick = ()=>{
      let allOk = true, msg = null;
      inps.forEach(inp=>{
        const id = inp.dataset.inp, v = parseNum(inp.value), ans = step.ans[id];
        const ok = !isNaN(v) && (Array.isArray(ans)? ans.some(a=>same(a,v)) : same(v,ans));
        inp.classList.remove('okv','badv'); void inp.offsetWidth;
        inp.classList.add(ok?'okv':'badv');
        if(!ok){ allOk=false; const w = step.wrong && step.wrong[id]; if(w && !isNaN(v)){ for(const k in w) if(same(parseNum(k),v)) msg = w[k]; } }
      });
      if(allOk){ inps.forEach(i=>i.disabled=true); b.remove(); $$('.sqk',body).forEach(x=>x.remove()); feedback(body,true,step.okMsg||'<b>¡Correcto!</b>'); finish(step, body); }
      else feedback(body,false, msg || step.hint || 'Revisa el valor marcado en rojo.');
    };
  },
  group(step, body){
    const phases = [['x','Toca los términos que tienen <b class="vx">x</b>'],['y','Ahora los que tienen <b class="vy">y</b>'],['c','Por último, el número solo: pásalo al otro lado']];
    body.innerHTML = `<h4>Paso 1 · Agrupa los términos</h4><p class="ph"></p><div class="terms">${step.terms.map((t,i)=>`<button class="term" data-i="${i}">${t[0]}</button>`).join('')}<span class="term eq">= 0</span></div>`;
    let p = 0, left = ()=> step.terms.filter(t=>t[1]===phases[p][0]).length, got = 0;
    const setP = ()=>{ $('.ph',body).innerHTML = phases[p][1]; };
    setP();
    $$('.term[data-i]',body).forEach(bt=> bt.onclick = ()=>{
      const t = step.terms[+bt.dataset.i];
      if(bt.classList.contains('g')) return;
      if(t[1]!==phases[p][0]){ bt.classList.remove('nope'); void bt.offsetWidth; bt.classList.add('nope'); feedback(body,false,'Ese no va en este grupo.'); return; }
      bt.classList.add('g', 'g'+t[1]); got++;
      if(got===left()){ got=0; p++; if(p<phases.length) setP(); else {
        $('.ph',body).remove();
        feedback(body,true,'<b>¡Agrupados!</b> Al pasar el número al otro lado, cambia de signo.');
        const a = h('div','',M(step.grouped)); body.appendChild(a); fit(a); finish(step, body); } }
    });
  },
  exam(step, body){
    body.innerHTML = `<h4>Tu misión</h4>${say('Resuélvelo en tu cuaderno y escribe aquí tus pistas. Puedes usar √ (ej: √6 o 4√6/3) o decimales.','think',46)}<div class="exf">${step.fields.map(f=>M(f.m)).join('')}</div>`;
    const inps = $$('input.blank',body); sqrtKey(body, inps);
    const b = h('button','btn','Verificar'); body.appendChild(b);
    const help = h('button','btn ghost','Me trabé: ver el modo guiado'); body.appendChild(help);
    help.onclick = ()=> openProblem(S.n,'guiado');
    inps.forEach(inp=> inp.addEventListener('keydown',e=>{ if(e.key==='Enter') b.click(); }));
    setTimeout(()=>inps[0] && inps[0].focus({preventScroll:true}), 400);
    b.onclick = ()=>{
      let all = true;
      step.fields.forEach(f=>{
        let fok = true;
        if(f.test){ // validación propia (ej. "cualquier punto de la recta")
          const inps = Object.keys(f.ids).map(id=>$(`input[data-inp="${id}"]`,body));
          if(!inps[0].disabled){
            const vals = {}; Object.keys(f.ids).forEach((id,i)=> vals[id] = parseNum(inps[i].value));
            const ok = Object.values(vals).every(v=>!isNaN(v)) && f.test(vals); f._vals = vals;
            inps.forEach(inp=>{ inp.classList.remove('okv','badv'); void inp.offsetWidth; inp.classList.add(ok?'okv':'badv'); });
            if(!ok) fok = false;
          }
        } else Object.entries(f.ids).forEach(([id,ans])=>{
          const inp = $(`input[data-inp="${id}"]`,body); if(inp.disabled) return;
          const v = parseNum(inp.value), ok = !isNaN(v) && same(v,ans);
          inp.classList.remove('okv','badv'); void inp.offsetWidth; inp.classList.add(ok?'okv':'badv');
          if(!ok) fok = false;
        });
        if(fok && !f.got){ f.got = true; Object.keys(f.ids).forEach(id=>$(`input[data-inp="${id}"]`,body).disabled=true); if(f.chk){ const [k,v]=f.chk(f._vals); API.check(k,v); } if(f.bank) API.bank(f.bank); }
        if(!fok) all = false;
      });
      if(all){ b.remove(); help.remove(); $$('.sqk',body).forEach(x=>x.remove()); feedback(body,true,'<b>¡Misión completa!</b> Ahora arma la ecuación.'); finish(step, body); }
      else feedback(body,false,'Revisa los valores en rojo. Los verdes ya quedaron guardados.');
    };
  },
  drag(step, body){
    body.innerHTML = `${step.lead||''}${M(step.m, step.big?'big':'')}<div class="chips"></div><div class="draghelp">Arrastra cada pieza a su casilla (o toca la pieza y luego la casilla).</div>`;
    const chipsBox = $('.chips',body);
    const chips = [...step.chips].sort(()=>Math.random()-.5);
    let sel = null, left = Object.keys(step.slots).length;
    const place = (chip, slotEl)=>{
      const raw = step.slots[slotEl.dataset.slot], wants = Array.isArray(raw)? raw : [raw], want = wants[0];
      if(slotEl.classList.contains('fill')) return;
      const core = new Set(['h','k','a2','b2']);
      const wantChip = step.chips.find(x=>x.id===want);
      const cObj = step.chips.find(x=>x.id===chip.dataset.id);
      let okPlace = wants.includes(chip.dataset.id) || (core.has(chip.dataset.id) && core.has(want) && wantChip && String(wantChip.val)===chip.dataset.val);
      let grpMsg = null;
      if(okPlace && cObj && cObj.grp){ const other = $$('.slot.fill',body).find(sl=>sl.dataset.grp && sl.dataset.grp!==cObj.grp);
        if(other){ okPlace = false; grpMsg = step.grpHint || 'Usa las dos coordenadas del mismo punto.'; } }
      if(okPlace){
        if(cObj && cObj.grp){ slotEl.dataset.grp = cObj.grp; S.vars = S.vars||{}; S.vars[step.key||'grp'] = cObj.grp; }
        slotEl.textContent = chip.dataset.val; slotEl.classList.add('fill');
        const c = step.chips.find(x=>x.id===chip.dataset.id); if(c && !c.reuse) chip.classList.add('used');
        chip.classList.remove('sel'); sel=null; $$('.slot',body).forEach(s=>s.classList.remove('sel-target'));
        fit(body);
        if(--left===0){ feedback(body,true, step.okMsg || '<b>¡Armada!</b>'); $('.draghelp',body).remove(); chipsBox.remove(); finish(step, body); }
      } else {
        slotEl.classList.remove('bad'); void slotEl.offsetWidth; slotEl.classList.add('bad');
        const c = step.chips.find(x=>x.id===chip.dataset.id);
        feedback(body,false, grpMsg || (c&&c.hint) || step.hint || 'Esa pieza no va ahí. Revisa tus pistas.');
        setTimeout(()=>slotEl.classList.remove('bad'),500);
      }
    };
    chips.forEach(c=>{
      const el = h('span','chip '+(c.cls||''), c.label); el.dataset.id=c.id; el.dataset.val=c.val; chipsBox.appendChild(el);
      let start=null, ghost=null;
      el.addEventListener('pointerdown',e=>{ start={x:e.clientX,y:e.clientY}; el.setPointerCapture(e.pointerId); });
      el.addEventListener('pointermove',e=>{
        if(!start) return;
        if(!ghost && Math.hypot(e.clientX-start.x,e.clientY-start.y)>6){ ghost = el.cloneNode(true); ghost.classList.add('ghost'); document.body.appendChild(ghost); }
        if(ghost){ ghost.style.left=(e.clientX-ghost.offsetWidth/2)+'px'; ghost.style.top=(e.clientY-ghost.offsetHeight/2)+'px';
          $$('.slot',body).forEach(s=>s.classList.remove('over'));
          const under = document.elementFromPoint(e.clientX,e.clientY); const sl = under && under.closest('.slot'); if(sl && body.contains(sl)) sl.classList.add('over'); }
      });
      el.addEventListener('pointerup',e=>{
        if(ghost){ ghost.remove(); ghost=null; $$('.slot',body).forEach(s=>s.classList.remove('over'));
          const under = document.elementFromPoint(e.clientX,e.clientY); const sl = under && under.closest('.slot'); if(sl && body.contains(sl)) place(el, sl); }
        else { // tap
          $$('.chip',body).forEach(x=>x.classList.remove('sel'));
          if(sel===el){ sel=null; $$('.slot',body).forEach(s=>s.classList.remove('sel-target')); }
          else { sel=el; el.classList.add('sel'); $$('.slot:not(.fill)',body).forEach(s=>s.classList.add('sel-target')); }
        }
        start=null;
      });
      el.addEventListener('pointercancel',()=>{ if(ghost) ghost.remove(); ghost=null; start=null; });
    });
    $$('.slot',body).forEach(s=> s.addEventListener('click',()=>{ if(sel) place(sel, s); }));
  },
  final(step, body, el){
    el.classList.add('final');
    const d = S.def;
    const secs = Math.round((Date.now()-S.t0)/1000), tt = `${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;
    const stats = S.mode==='examen' ? `<div class="stats"><div><b>${tt}</b>tiempo</div><div><b>${S.errs}</b>${S.errs===1?'error':'errores'}</div><div><b>${S.errs===0?'100':Math.max(60,100-8*S.errs)}</b>puntaje</div></div>` : '';
    body.innerHTML = `${say(`¡Misión cumplida${S.mode==='examen'?' en modo examen':''}! ${S.mode==='examen' && S.errs===0 ? '¡Sin un solo error!' : '¡Lo lograste!'}`,'joy',64)}<div class="win">${M(d.answer,'big')}${d.general?M(d.general):''}</div>${stats}${d.table||''}<p class="note">${d.recap||''}</p>`;
    fit(body); API.full(); done.add(S.n); saveDone(); renderNav(S.n); confetti();
    const nextN = ORDER[ORDER.indexOf(S.n)+1];
    const b = h('button','btn', nextN?`Ir al problema ${ORDER.indexOf(nextN)+1}`:'Ver el recorrido completo'); body.appendChild(b);
    b.onclick = ()=> nextN ? openProblem(nextN) : showSummary();
  },
};

function dataStep(def){ return { t:'data', enun:def.enun, datos:def.datos, okMsg:def.dataMsg, done:def.afterData, auto:true, next:'Continuar' }; }
function orientStep(def, exam){
  const Hsvg = TOOL.iconH || `<svg width="64" height="40" viewBox="0 0 64 40"><ellipse cx="32" cy="20" rx="28" ry="15" fill="${T.acc}" fill-opacity=".12" stroke="${T.acc}" stroke-width="3"/></svg>`;
  const Vsvg = TOOL.iconV || `<svg width="64" height="40" viewBox="0 0 64 40"><ellipse cx="32" cy="20" rx="12" ry="18" fill="${T.acc}" fill-opacity=".12" stroke="${T.acc}" stroke-width="3"/></svg>`;
  const O = def.orient || {ans: (def.curve||def.ell).v?'v':'h'};
  const isH = O.ans==='h';
  const yes = exam ? '<b>¡Correcto!</b>' : `<b>¡Sí!</b> ${O.why}`, no = exam ? 'No es esa.' : O.nope;
  return { t:'mc', q:`¿Cuál es la orientación de ${TOOL.curveName}?`, lead: exam? '' : O.lead, row:true,
    opts:[ {h:Hsvg+'Horizontal', ok:isH, fb: isH? yes : no},
           {h:Vsvg+'Vertical', ok:!isH, fb: !isH? yes : no} ],
    done: A=>{ A.check('orient', isH?'Horizontal':'Vertical'); if(!exam) A.ghost(); },
    next: exam ? 'Continuar' : 'Ver la gráfica y seguir' };
}
function finalStep(def){ return { t:'final' }; }


/* ---------- resumen final (usa SUMMARY del contenido) ---------- */
function showSummary(){
  S=null; renderNav(null);
  $('#app').innerHTML = `<div class="slide on" style="min-height:auto"><h2>Tu mapa de estrategias</h2>
    ${say(SUMMARY.say,'joy',64)}
    <div style="border-top:1px solid var(--line);margin-top:14px">${SUMMARY.rows.map(r=>`<div class="sumrow"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}</div>
    <p style="font-family:Nunito;font-weight:900;font-size:22px;margin-top:22px">${SUMMARY.close}</p>
    <button class="cta" onclick="showIntro()">Repasar el video</button></div>`;
  confetti(); window.scrollTo({top:0});
}

/* ---------- arranque ---------- */
document.title = `${TOOL.title} · EUREMA`;
{ const bd = h('div','backdrop'); bd.setAttribute('aria-hidden','true'); bd.innerHTML = backdropSVG(); document.body.prepend(bd); }
$('#subT').textContent = TOOL.subtitle;
showIntro();
